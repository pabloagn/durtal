# =============================================================================
# Durtal — Local Development Compose
# =============================================================================
# This is for local development only. Production runs as a single container
# on osmium.rh with Neon (remote) and S3 (remote).
# =============================================================================

services:
  durtal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public browser value, inlined at build time. Secrets stay runtime-only.
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
    container_name: durtal-dev
    ports:
      - "3100:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - ISBNDN_API_KEY=${ISBNDN_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - NODE_ENV=production
    restart: unless-stopped
